name: Release

# Builds FFmpeg from the pinned upstream release (ffmpeg.env) for every PAM platform, audits each
# build against SPEC's licensing rules, and on a tag publishes everything as a GitHub Release.
# Tag format: ffmpeg-<FFMPEG_VERSION>-pam.<N>, e.g. ffmpeg-7.1.5-pam.1.
on:
  workflow_dispatch:
  push:
    tags: ['ffmpeg-*']

permissions:
  contents: write
  # Pulls the private FLIR Poky toolchain image for linux-cortexa9t2hf.
  packages: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble source archive
        run: scripts/make_source.sh out

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: out/*-source.tar.xz

  # Built from the source archive, not the checkout, so the published source matches the binaries.
  # Each build runs in a container with the oldest glibc among that target's PAM consumers:
  # Ubuntu 22.04 for x86_64, Ubuntu 18.04 (SLA camera) for aarch64 on a native arm runner, and
  # FLIR's Poky 3.3 SDK image for cortexa9t2hf.
  # docker run instead of a job container: Node 24 actions don't run on Ubuntu 18.04's glibc.
  linux:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
            image: ubuntu:22.04
          - target: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:18.04
          - target: cortexa9t2hf
            runner: ubuntu-24.04
            image: ghcr.io/aquanta-vision/toolchain-poky-3.3-cortexa9t2hf:55
    runs-on: ${{ matrix.runner }}
    steps:
      # The Poky image is about 10 GB; drop preinstalled SDKs we don't use to make room.
      - name: Free disk space
        if: startsWith(matrix.image, 'ghcr.io/')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        if: startsWith(matrix.image, 'ghcr.io/')
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-ffmpeg-*/)" >> "$GITHUB_ENV"

      - name: Build and audit in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }} \
            bash "${SOURCE_ROOT}pam-build/scripts/ci_linux.sh" ${{ matrix.target }} "$SOURCE_ROOT" out/linux-${{ matrix.target }}

      - name: Package
        run: tar -cJf "${SOURCE_ROOT%/}-linux-${{ matrix.target }}.tar.xz" -C out linux-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: pam-ffmpeg-*-linux-${{ matrix.target }}.tar.xz

  # MSVC under MSYS2 (FFmpeg's configure needs a POSIX shell). arm64 is cross-compiled on x64,
  # then audited on an arm64 runner in windows-arm64-audit.
  windows:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            msvc_arch: x64
          - target: arm64
            msvc_arch: x64_arm64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          release: false
          update: false
          install: make diffutils nasm pkgconf perl

      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-ffmpeg-*/)" >> "$GITHUB_ENV"

      - name: Load MSVC ${{ matrix.msvc_arch }} environment
        shell: pwsh
        run: '& "$env:SOURCE_ROOT/pam-build/scripts/msvc_env.ps1" ${{ matrix.msvc_arch }}'

      - name: Build and audit
        run: |
          "${SOURCE_ROOT}pam-build/scripts/ci_windows.sh" ${{ matrix.target }} "$SOURCE_ROOT" out/windows-${{ matrix.target }}

      - name: Package
        run: tar -cJf "${SOURCE_ROOT%/}-windows-${{ matrix.target }}.tar.xz" -C out windows-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.target }}
          path: pam-ffmpeg-*-windows-${{ matrix.target }}.tar.xz

  # The x64 runner cannot execute arm64 binaries, so the arm64 build is audited here.
  windows-arm64-audit:
    needs: windows
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{source,windows-arm64}'
          merge-multiple: true

      - name: Extract source and build
        run: |
          tar -xJf *-source.tar.xz
          tar -xJf *-windows-arm64.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-ffmpeg-*/)" >> "$GITHUB_ENV"

      - name: Load MSVC arm64 environment
        shell: pwsh
        run: '& "$env:SOURCE_ROOT/pam-build/scripts/msvc_env.ps1" arm64'

      - name: Audit
        run: '"${SOURCE_ROOT}pam-build/scripts/audit_windows.sh" windows-arm64'

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, linux, windows, windows-arm64-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check tag matches ffmpeg.env
        run: |
          source ffmpeg.env
          [[ "$GITHUB_REF_NAME" =~ ^ffmpeg-${FFMPEG_VERSION//./\\.}-pam\.[0-9]+$ ]] || {
            echo "::error::tag $GITHUB_REF_NAME does not match FFMPEG_VERSION=$FFMPEG_VERSION"
            exit 1
          }

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes ""
