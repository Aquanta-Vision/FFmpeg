name: Release

# Builds FFmpeg from the pinned upstream release (ffmpeg.env) for every PAM platform, audits each
# build against SPEC's licensing rules, and on a tag publishes everything as a GitHub Release.
# Tag format: ffmpeg-<FFMPEG_VERSION>-pam.<N>, e.g. ffmpeg-7.1.5-pam.1.
on:
  workflow_dispatch:
  push:
    tags: ['ffmpeg-*']

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble source archive
        run: scripts/make_source.sh out

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: out/*-source.tar.xz

  # Built from the source archive, not the checkout, so the published source matches the binaries.
  # Each build runs in a container with the oldest glibc among that arch's PAM consumers:
  # Ubuntu 22.04 for x86_64, Ubuntu 18.04 (SLA camera) for aarch64, on a native arm runner.
  # docker run instead of a job container: Node 24 actions don't run on Ubuntu 18.04's glibc.
  linux:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            image: ubuntu:22.04
            packages: build-essential nasm pkg-config
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:18.04
            packages: build-essential pkg-config
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Extract source
        run: |
          tar -xJf *-source.tar.xz
          echo "SOURCE_ROOT=$(ls -d pam-ffmpeg-*/)" >> "$GITHUB_ENV"

      - name: Build and audit in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e SOURCE_ROOT -e PLATFORM=${{ matrix.platform }} -e PACKAGES="${{ matrix.packages }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} bash -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends $PACKAGES
              $SOURCE_ROOT/pam-build/scripts/build_linux.sh $SOURCE_ROOT out/$PLATFORM
              $SOURCE_ROOT/pam-build/scripts/audit_linux.sh out/$PLATFORM'

      - name: Package
        run: tar -cJf "${SOURCE_ROOT%/}-${{ matrix.platform }}.tar.xz" -C out ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: pam-ffmpeg-*-${{ matrix.platform }}.tar.xz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check tag matches ffmpeg.env
        run: |
          source ffmpeg.env
          [[ "$GITHUB_REF_NAME" =~ ^ffmpeg-${FFMPEG_VERSION//./\\.}-pam\.[0-9]+$ ]] || {
            echo "::error::tag $GITHUB_REF_NAME does not match FFMPEG_VERSION=$FFMPEG_VERSION"
            exit 1
          }

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes ""
